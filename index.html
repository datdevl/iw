<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="theme-color" content="#080b12">
<title>INFINITE WALLPAPER LEGACY</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="screen">
  <div id="background"></div>
  <img id="wallpaper" src="" alt="Wallpaper">
  <div id="overlay"></div>
  <div id="header">
    <div class="logo">INFINITE <span>WALLPAPER</span></div>
    <div id="status">ĐANG KẾT NỐI NGUỒN ẢNH...</div>
  </div>
  <div id="content">
    <div class="small-title">ZERO API KEY EXPERIENCE</div>
    <h1 id="headline">Explore<br><em>the infinite.</em></h1>
    <p id="caption">Thế giới hình ảnh trong tầm mắt.</p>
    <div id="credit">Đang tải ảnh...</div>
  </div>
  <div id="footer">
    <div id="count">000</div>
    <div id="buttons">
      <button id="prev" type="button">TRƯỚC</button>
      <button id="play" type="button">TẠM DỪNG</button>
      <button id="next" type="button">TIẾP THEO</button>
    </div>
    <div id="right">
      <select id="speed">
        <option value="8">8 giây</option>
        <option value="12" selected="selected">12 giây</option>
        <option value="20">20 giây</option>
        <option value="30">30 giây</option>
        <option value="60">60 giây</option>
      </select>
      <button id="full" type="button">TOÀN MÀN HÌNH</button>
    </div>
  </div>
  <div id="progress"><div id="progressbar"></div></div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
